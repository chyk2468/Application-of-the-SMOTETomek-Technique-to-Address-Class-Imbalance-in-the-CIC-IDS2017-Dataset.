<title id="title">CIC-IDS2017 Intrusion Detection workflow</title><desc id="desc">A notebook pipeline for cleaning CIC-IDS2017 data, grouping labels, applying SMOTETomek on training data, and comparing classifiers.</desc><rect width="1200" height="400" rx="18" fill="#F0F3F6"/>
<text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#315E78">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#263746">CIC-IDS2017 Intrusion Detection</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#697984">Prepare imbalanced network traffic for model evaluation</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D5DEE5"/><path d="M 300 237 L 330 237" stroke="#697984" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#697984" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#697984" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#697984" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#697984" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#697984" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#315E78"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#315E78">01 / RAW TRAFFIC</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263746">CIC-IDS2017 CSV</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697984">Load and combine traffic records.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#AD5144"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#AD5144">02 / PREPROCESS</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263746">Clean and label</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697984">Handle missing values and map labels.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#6C8B82"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6C8B82">03 / RESAMPLE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263746">SMOTETomek</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697984">Balance training data only.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D5DEE5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#315E78"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#315E78">04 / EVALUATE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#263746">RF and LSTM</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697984">Compare classification metrics.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#315E78">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#697984">Fit preprocessing and resampling only on training data to avoid leakage.</text></svg>